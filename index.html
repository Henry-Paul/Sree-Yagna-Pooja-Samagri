<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Yagnaa | Official Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
.no-scrollbar::-webkit-scrollbar { display:none }
@keyframes slideIn { from { transform:translateX(100%) } to { transform:translateX(0) } }
.animate-slide { animation: slideIn .3s ease-out }
</style>
</head>

<body class="bg-gray-50 text-gray-800">
<div id="root"></div>

<script type="text/babel">

const { useState } = React;

const PRODUCTS = [

{
id:1,
title:"Varalakshmi Pooja Complete Set",
category:"Pooja Kits",
price:999,
image:"https://images.unsplash.com/photo-1605379399642-870262d3d051",
amazonLink:"https://www.amazon.in/dp/B0C622TZB8"
},

{
id:2,
title:"Navagraha Navadhanyalu (9 Grains Set)",
category:"Pooja Kits",
price:499,
image:"https://images.unsplash.com/photo-1597304985890-0d7b17a9f0e2",
amazonLink:"https://www.amazon.in/dp/B0GJ4P4KMP"
},

{
id:3,
title:"Brass Shank Chakra Diya",
category:"Pooja Articles",
price:799,
image:"https://images.unsplash.com/photo-1607082349566-187342175e2f",
amazonLink:"https://www.amazon.in/dp/B0CD47NH2Q"
},

{
id:4,
title:"Laksha Vathulu Cotton Wicks Pack",
category:"Supplies",
price:299,
image:"https://images.unsplash.com/photo-1582735689369-4fe89db7114c",
amazonLink:"https://www.amazon.in/dp/B0CVN691CF"
},

{
id:5,
title:"Pasupu Kumkum MDF Return Gift Set",
category:"Return Gifts",
price:349,
image:"https://images.unsplash.com/photo-1623082574085-157d955f8d29",
amazonLink:"https://www.amazon.in/dp/B0CVNBSTTC"
},

{
id:6,
title:"Brass Ganesha Idol - Jilledu",
category:"Idols",
price:899,
image:"https://images.unsplash.com/photo-1623082574085-157d955f8d29",
amazonLink:"https://www.amazon.in/dp/B0C61F3PCF"
}

];

function App(){

const [cart,setCart]=useState([]);
const [open,setOpen]=useState(false);
const [search,setSearch]=useState("");
const [category,setCategory]=useState("All");

const filtered = PRODUCTS.filter(p =>
(category==="All" || p.category===category) &&
p.title.toLowerCase().includes(search.toLowerCase())
);

const addToCart=(p)=>{
setCart(prev=>{
const exists=prev.find(i=>i.id===p.id);
if(exists){
return prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
}
return [...prev,{...p,qty:1}];
});
setOpen(true);
};

const subtotal = cart.reduce((sum,i)=>sum+(i.price*i.qty),0);

return(
<div className="max-w-screen-xl mx-auto">

<header className="sticky top-0 bg-white border-b shadow-sm z-40">
<div className="bg-rose-600 text-white text-xs text-center py-1 font-bold">
5% OFF FIRST ORDER – CODE: FIRST5
</div>

<div className="flex justify-between items-center px-4 py-3">
<h1 className="text-xl font-black text-rose-600 uppercase">
Sri Yagnaa
</h1>

<button onClick={()=>setOpen(true)} className="relative">
🛒
{cart.length>0 &&
<span className="absolute -top-2 -right-2 bg-rose-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">
{cart.length}
</span>}
</button>
</div>

<div className="px-4 pb-3">
<input
onChange={e=>setSearch(e.target.value)}
placeholder="Search pooja items..."
className="w-full bg-gray-100 rounded-lg py-2 px-4 text-sm outline-none"
/>
</div>
</header>

<div className="p-4 flex gap-2 overflow-x-auto no-scrollbar">
{["All","Pooja Kits","Pooja Articles","Supplies","Return Gifts","Idols"].map(cat=>(
<button
key={cat}
onClick={()=>setCategory(cat)}
className={`px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap
${category===cat?"bg-rose-600 text-white":"bg-white border text-gray-600"}`}
>
{cat}
</button>
))}
</div>

<div className="p-4 grid grid-cols-2 md:grid-cols-4 gap-4">

{filtered.map(product=>(
<div key={product.id}
className="bg-white rounded-xl shadow-sm border flex flex-col overflow-hidden">

<img src={product.image}
className="w-full h-40 object-cover"/>

<div className="p-3 flex flex-col flex-1">

<h3 className="text-xs md:text-sm font-bold mb-2">
{product.title}
</h3>

<div className="text-rose-600 font-black mb-3">
₹{product.price}
</div>

<div className="mt-auto space-y-2">

<button
onClick={()=>addToCart(product)}
className="w-full bg-rose-50 text-rose-600 text-xs font-bold py-2 rounded">
Add to Cart
</button>

<a
href={product.amazonLink}
target="_blank"
className="w-full bg-orange-400 text-white text-xs font-bold py-2 rounded text-center block">
View on Amazon
</a>

</div>
</div>
</div>
))}

</div>

{open && (
<div className="fixed inset-0 flex justify-end z-50">

<div className="absolute inset-0 bg-black/40"
onClick={()=>setOpen(false)} />

<div className="relative w-full max-w-sm bg-white h-full animate-slide flex flex-col">

<div className="p-4 border-b flex justify-between">
<h2 className="font-black text-lg">My Cart</h2>
<button onClick={()=>setOpen(false)}>✕</button>
</div>

<div className="flex-1 overflow-y-auto p-4 space-y-3">

{cart.length===0?
<p className="text-gray-500">Cart is empty</p>:

cart.map(item=>(
<div key={item.id} className="flex justify-between text-sm">
<span>{item.title} x {item.qty}</span>
<span>₹{item.price*item.qty}</span>
</div>
))
}

</div>

<div className="p-4 border-t">
<div className="flex justify-between font-bold text-lg">
<span>Total</span>
<span>₹{subtotal}</span>
</div>

<button className="mt-4 w-full bg-rose-600 text-white py-3 rounded font-bold">
Checkout Now
</button>

</div>
</div>
</div>
)}

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
